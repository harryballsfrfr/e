
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Copper Lung Protocol</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* -- UI: Objective Tracker (Top Right) -- */
        #objective-tracker {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #a3ff9e;
            text-shadow: 0 0 8px rgba(163, 255, 158, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        .step { opacity: 0.4; font-size: 14px; margin-bottom: 8px; transition: opacity 0.3s; }
        .active-step { opacity: 1; font-size: 18px; font-weight: bold; }
        
        /* -- UI: Mobile Joystick Container -- */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            display: none;
            z-index: 10;
        }

        /* -- UI: PC Start Screen -- */
        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; display: flex; 
            flex-direction: column;
            justify-content: center; align-items: center; text-align: center; cursor: pointer; z-index: 20;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255,255,255,0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="objective-tracker">
        <div class="step active-step" id="step1">[ ] Locate the central hub</div>
        <div class="step" id="step2">[ ] Reset the air filtration</div>
        <div class="step" id="step3">[ ] Avoid the Weaver</div>
    </div>

    <div id="crosshair"></div>
    <div id="joystick-zone"></div>
    <div id="blocker">
        <h1>THE COPPER LUNG PROTOCOL</h1>
        <p>Click to Initialize Systems</p>
        <span style="font-size:14px; color:#888;">PC: WASD to Move, Mouse to Look<br>Mobile: Left Joystick to Move, Right Screen to Look</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script>
        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);
        scene.fog = new THREE.FogExp2(0x010101, 0.12);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.7;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. HORROR LIGHTING ---
        const flashLight = new THREE.SpotLight(0xffffff, 2.5, 25, Math.PI/7, 0.4, 2);
        flashLight.castShadow = true;
        flashLight.shadow.mapSize.width = 1024;
        flashLight.shadow.mapSize.height = 1024;
        camera.add(flashLight);
        camera.add(flashLight.target);
        flashLight.target.position.set(0, 0, -1);
        scene.add(camera);

        // --- 3. THE ENVIRONMENT ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Create industrial "pillars"
        const pillarGeo = new THREE.BoxGeometry(1.5, 6, 1.5);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.4 });
        for (let i = 0; i < 40; i++) {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set((Math.random()-0.5)*60, 3, (Math.random()-0.5)*60);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }

        // --- 4. CONTROLS & DETECTION ---
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let controls, moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let moveJoystick = { x: 0, y: 0 };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const clock = new THREE.Clock();

        if (isTouch) {
            document.getElementById('blocker').style.display = 'none';
            document.getElementById('joystick-zone').style.display = 'block';
            
            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static', position: { left: '50%', top: '50%' }, color: 'gray'
            });
            joystick.on('move', (evt, data) => {
                moveJoystick.x = Math.cos(data.angle.radian) * Math.min(data.force, 1);
                moveJoystick.y = Math.sin(data.angle.radian) * Math.min(data.force, 1);
            });
            joystick.on('end', () => { moveJoystick = { x: 0, y: 0 }; });

            // Right-side look controls
            let isDragging = false, prevX = 0, prevY = 0;
            window.addEventListener('touchstart', (e) => {
                if(e.touches[0].clientX > window.innerWidth/2) {
                    isDragging = true;
                    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
                }
            });
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    camera.rotation.y -= (e.touches[0].clientX - prevX) * 0.006;
                    camera.rotation.x -= (e.touches[0].clientY - prevY) * 0.006;
                    camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
                    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
                }
            });
            window.addEventListener('touchend', () => isDragging = false);
        } else {
            controls = new THREE.PointerLockControls(camera, document.body);
            document.getElementById('blocker').addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => document.getElementById('blocker').style.display = 'none');
            controls.addEventListener('unlock', () => document.getElementById('blocker').style.display = 'flex');

            const onKeyDown = (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
            };
            const onKeyUp = (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (!isTouch && controls && controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            } else if (isTouch) {
                const moveVec = new THREE.Vector3(moveJoystick.x, 0, -moveJoystick.y);
                moveVec.applyQuaternion(camera.quaternion);
                moveVec.y = 0;
                camera.position.addScaledVector(moveVec, 5 * delta);
            }

            // Horror Flicker
            if(Math.random() > 0.97) flashLight.intensity = 0.5 + Math.random() * 2;
            else flashLight.intensity = 2.5;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
